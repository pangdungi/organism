          },
          cherryspoon: {
            family: "LP Ongleip Mitmi",
            weight: "400",
            url: "/fonts/LP-Ongleip-Mitmi.ttf",
          },
        };
        var CALENDAR_FONT_PRELOADS = [
          { url: "/fonts/LP-LeeSeoyun.otf", type: "font/otf" },
          { url: "/fonts/Hello-Scratchy-Outlines.otf", type: "font/otf" },
        ];
        function preloadFontAsset(url, mime) {
          if (!url) return;
          var link = document.createElement("link");
          link.rel = "preload";
          link.href = url;
          link.as = "font";
          link.type = mime || "font/ttf";
          link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        }
        var FALLBACK = MAP.leeseoyun;
        var fontId = "leeseoyun";
        try {
          var uid = localStorage.getItem("lp_last_auth_uid") || "";
          if (uid) {
            var cached = localStorage.getItem("lp:u:" + uid + ":user_ui_font_id");
            if (cached && MAP[cached]) fontId = cached;
          }
        } catch (_) {}
        var def = MAP[fontId] || FALLBACK;
        preloadFontAsset(def.url, def.type || "font/ttf");
        for (var i = 0; i < CALENDAR_FONT_PRELOADS.length; i++) {
          preloadFontAsset(
            CALENDAR_FONT_PRELOADS[i].url,
            CALENDAR_FONT_PRELOADS[i].type,
          );
        }
        var stack =
          '"' +
          def.family +
          '", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        try {
          document.documentElement.style.setProperty(
            "--lp-app-font-family",
            stack,
          );
          document.documentElement.style.setProperty(
            "--lp-app-font-weight-base",
            def.weight,
          );
          document.documentElement.style.fontFamily = stack;
          document.documentElement.style.fontWeight = def.weight;
        } catch (_) {}
      })();

      </div>

    <script>
      (function () {
        var BOOT_MS = 16000;
        var bootTimer = null;

        function hideSplashNow() {
          var splash = document.getElementById("app-splash");
          if (!splash || splash.hasAttribute("hidden")) return;
          splash.classList.add("app-splash--exiting");
          splash.setAttribute("aria-busy", "false");
          setTimeout(function () {
            splash.setAttribute("hidden", "");
            splash.setAttribute("aria-hidden", "true");
            try {
              document.documentElement.classList.remove("lp-splash-active");
            } catch (_e) {}
            splash.style.removeProperty("height");
            splash.style.removeProperty("min-height");
          }, 280);
        }

        function syncSplashViewportEarly() {
          var splash = document.getElementById("app-splash");
          if (!splash || splash.hasAttribute("hidden")) return;
          var h = window.innerHeight || 0;
          try {
            var vv = window.visualViewport;
            if (vv && vv.height > 0) {
              h = Math.max(h, vv.height + (vv.offsetTop || 0));
            }
          } catch (_e) {}
          if (h > 0) {
            splash.style.height = h + "px";
            splash.style.minHeight = h + "px";
          }
        }

        syncSplashViewportEarly();
        window.addEventListener("resize", syncSplashViewportEarly, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", syncSplashViewportEarly, {
            passive: true,
          });
        }

        function showBootFallback() {
          if (window.__lpBootReady) return;
          hideSplashNow();
          try {
            document.documentElement.classList.remove("lp-auth-booting");
          } catch (_e) {}
          var app = document.getElementById("app");
          if (app) app.style.display = "block";
          var fb = document.getElementById("lp-boot-fallback");
          if (fb) {
            fb.removeAttribute("hidden");
            fb.setAttribute("aria-hidden", "false");
          }
        }

        function hardReload() {
          try {
            sessionStorage.removeItem("lp_boot_autoretry");
          } catch (_e) {}
          try {
            var u = new URL(window.location.href);
            u.searchParams.set("_boot", String(Date.now()));
            window.location.replace(u.toString());
          } catch (_e2) {
            window.location.reload();
          }
        }

        function isAnyAppPageVisible() {
          var pages = document.querySelectorAll("#app > .page");
          for (var i = 0; i < pages.length; i++) {
            if (getComputedStyle(pages[i]).display !== "none") return true;
          }
          return false;
        }

        function bootStillStuck() {
          if (window.__lpBootReady) return false;
          var splash = document.getElementById("app-splash");
          var splashVisible = splash && !splash.hasAttribute("hidden");
          if (splashVisible) return true;
          return !isAnyAppPageVisible();
        }

        function onBootWatchdog() {
          if (!bootStillStuck()) return;
          var retried = false;
          try {
            retried = sessionStorage.getItem("lp_boot_autoretry") === "1";
          } catch (_e) {}
          if (!retried) {
            try {
              sessionStorage.setItem("lp_boot_autoretry", "1");
            } catch (_e2) {}
            hardReload();
            return;
          }
          showBootFallback();
        }

        window.__lpMarkBootReady = function () {
          window.__lpBootReady = true;
          if (bootTimer) {
            clearTimeout(bootTimer);
            bootTimer = null;
          }
          try {
            sessionStorage.removeItem("lp_boot_autoretry");
          } catch (_e) {}
          var fb = document.getElementById("lp-boot-fallback");
          if (fb) {
            fb.setAttribute("hidden", "");
            fb.setAttribute("aria-hidden", "true");
          }
        };

        window.__lpShowBootFailure = function () {
          if (window.__lpBootReady) return;
          if (bootTimer) {
            clearTimeout(bootTimer);
            bootTimer = null;
          }
          showBootFallback();
        };

        window.addEventListener(
          "error",
          function (ev) {
            if (window.__lpBootReady) return;
            var t = ev && ev.target;
            if (t && t.tagName === "SCRIPT") {
              window.__lpShowBootFailure();
            }
          },
          true,
        );

        document.getElementById("lp-boot-retry-btn")?.addEventListener("click", hardReload);

        bootTimer = setTimeout(onBootWatchdog, BOOT_MS);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
