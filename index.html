        transition: opacity 0.38s ease;
      }
      .app-splash--exiting {

      }
      .app-splash-bg {

        inset: 0;
        overflow: hidden;
        pointer-events: none;

        width: min(72vw, 20rem);
        height: min(72vw, 20rem);
        background: rgba(0, 0, 0, 0.04);
        clip-path: circle(50% at 50% 50%);
        animation: app-splash-orb-drift 9s ease-in-out infinite;
      }
      .app-splash-orb--tl {
        top: -18%;
        left: -22%;
        animation-delay: 0s;
      }
      .app-splash-orb--bl {
        bottom: -28%;
        left: -18%;
        animation-delay: -4.5s;
      }
      @keyframes app-splash-orb-drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(14px, 10px) scale(1.03);
        }
      }
      .app-splash-main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .app-splash-brand {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-weight: 700;
        font-size: clamp(2.75rem, 13vw, 4.75rem);
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: var(--app-splash-cream);
      }
      /* 기업 웹필터·크롤러가 볼 수 있도록 스플래시에도 정적 설명 문구(숨김 #app 보완) */
      .app-splash-tagline {
        margin: 0.75rem 0 0;
        max-width: 22rem;
        padding: 0 1rem;
        box-sizing: border-box;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        font-size: clamp(0.75rem, 3.2vw, 0.875rem);
        font-weight: 400;
        line-height: 1.55;
        letter-spacing: -0.02em;
        color: var(--app-splash-cream);
        opacity: 0.9;
      }
      .app-splash-footer {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        padding-bottom: 0.25rem;
      }
      .app-splash-bar-track {
        width: min(32vw, 8rem);
        height: 2px;
        background: rgba(60, 60, 67, 0.18);
        overflow: hidden;
      }
      .app-splash-bar-fill {
        width: 38%;
        height: 100%;
        background: var(--app-splash-cream);
        animation: app-splash-bar-slide 1.35s ease-in-out infinite;
      }
      @keyframes app-splash-bar-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .app-splash-loading-label {

        font-size: 0.5625rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        color: var(--app-splash-cream);
        opacity: 0.75;

      .app-splash-arrow {
        color: var(--app-splash-cream);
        opacity: 0.5;
        animation: app-splash-arrow-nudge 2.2s ease-in-out infinite;
      }

        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        50% {
          transform: translateY(4px);
          opacity: 0.65;
        }
      }

        .app-splash-orb,
        .app-splash-bar-fill,
        .app-splash-arrow {
          animation: none;
        }
        .app-splash-bar-fill {
          width: 100%;
          transform: none;
          opacity: 0.85;
          animation: none;
        }

        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        box-sizing: border-box;
      }

          aria-hidden="true"
        >
          <div class="auth-pw-modal__backdrop" tabindex="-1" aria-hidden="true"></div>
          <div
            class="auth-pw-modal__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="auth-pw-modal-title"
          >
            <div class="auth-pw-modal__head">
              <h2 id="auth-pw-modal-title" class="auth-pw-modal__title">비밀번호를 잊었나요?</h2>
              <button type="button" class="auth-pw-modal__close" id="auth-pw-modal-close" aria-label="닫기">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <div class="auth-pw-modal__body">
              <div id="forgot-pw-form" class="login-change-form">
                <p class="login-forgot-desc">가입한 이메일 주소를 입력하면 비밀번호 재설정 링크를 보내드려요.</p>
                <input
                  type="text"
                  id="forgot-pw-email"
                  class="login-input login-input--auth"
                  placeholder="이메일 주소"
                  autocomplete="email"
                />
                <div class="login-change-actions">
                  <button type="button" class="login-btn-cta login-btn-sm" id="btn-send-reset-mail">
                    재설정 메일 보내기
                  </button>
                  <button type="button" class="login-link" id="btn-cancel-forgot">취소</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 비밀번호 재설정 (이메일 링크 클릭 후) -->
      <div id="reset-password-page" class="page login-page login-page--gate" style="display: none">
        <header class="auth-gate-header">
          <div class="auth-gate-header-inner">
            <span class="auth-gate-logo">Organism</span>
          </div>
        </header>
        <div class="auth-gate-body">
        <div class="login-wrap">
          <div class="login-card login-card--brand">
            <h1 class="login-title">새 비밀번호 설정</h1>
            <p class="login-desc">새 비밀번호를 입력해 주세요.</p>
            <form class="login-form login-form--auth-gate" onsubmit="return false">
              <div class="login-field login-field--auth">
                <label class="login-label" for="reset-pw-new">새 비밀번호</label>
                <input
                  type="password"
                  id="reset-pw-new"
                  class="login-input login-input--auth"
                  placeholder="새 비밀번호 (6자 이상)"
                  autocomplete="new-password"
                />
              </div>
              <div class="login-field login-field--auth">
                <label class="login-label" for="reset-pw-confirm">새 비밀번호 확인</label>
                <input
                  type="password"
                  id="reset-pw-confirm"
                  class="login-input login-input--auth"
                  placeholder="새 비밀번호 확인"
                  autocomplete="new-password"
                />
                <label class="login-show-pw">
                  <input type="checkbox" id="reset-pw-show" class="login-show-pw-checkbox" /> 비밀번호 보기
                </label>
              </div>
              <button type="button" class="login-btn-cta" id="btn-reset-pw-submit">비밀번호 변경하기</button>
            </form>
          </div>
        </div>
        </div>
      </div>

      <!-- 로그인 성공 후 메인 앱 -->
      <div id="signin-page" class="page" style="display:none">
        <div id="app-screen"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
