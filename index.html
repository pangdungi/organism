<!DOCTYPE html>
<html lang="ko" class="lp-app-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- translucent + viewport-fit=cover 일 때 세로 세이프는 #signin-page 에만 두고 안쪽은 중복 금지 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Time is Price" />
    <meta name="application-name" content="Time is Price" />
    <meta
      name="description"
      content="Time is Price는 KPI·목표·시간 기록·일정·가계부·일지를 한곳에서 다루는 생산성 웹 서비스입니다. organismplanner.com에서 회원가입 후 데이터를 클라우드에 동기화할 수 있습니다."
    />
    <meta
      name="keywords"
      content="Time is Price, 플래너, KPI, 시간관리, 일정, 생산성, 가계부, organismplanner"
    />
    <link rel="canonical" href="https://organismplanner.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Time is Price" />
    <meta property="og:title" content="Time is Price" />
    <meta
      property="og:description"
      content="KPI·목표·시간 기록·일정·가계부를 연결하는 생산성 플래너 웹 서비스입니다."
    />
    <meta property="og:url" content="https://organismplanner.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://organismplanner.com/icon-512.png?v=timeisprice-icon-2" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Time is Price" />
    <meta
      name="twitter:description"
      content="KPI·목표·시간 기록·일정을 한곳에서 관리하는 웹 서비스입니다."
    />
    <title>Time is Price</title>
    <!-- manifest 캐시로 예전 앱 이름이 남는 경우 방지: 쿼리 변경 시 브라우저가 다시 받음 -->
    <link rel="manifest" href="/manifest.json?v=timeisprice-brand-2" />
    <!-- 스플래시·브랜드용 Archivo Bold — swap 깜빡임 방지: main.css 파싱 전에 우선 로드 -->
    <link rel="preload" href="/fonts/Archivo-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&family=Noto+Sans+KR:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=timeisprice-icon-2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=timeisprice-icon-2" />
    <!-- FOUC 방지 + main.css 도착 전에도 스플래시가 완전한 모습으로 첫 페인트되도록 인라인에 전부 포함 -->
    <style>
      html,
      body {
        margin: 0;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
      }
      #app {
        display: none;
      }
      .app-splash {
        --app-splash-bg: #f0f4fa;
        --app-splash-ink: #1a5fa8;
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top, 0)) 1.5rem max(2rem, env(safe-area-inset-bottom, 0));
        box-sizing: border-box;
        background: var(--app-splash-bg);
        color: var(--app-splash-ink);
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.38s ease;
      }
      .app-splash--exiting {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-bar-wrap {
        width: min(11rem, 48vw);
        max-width: 100%;
      }
      .app-splash-bar-track {
        height: 3px;
        border-radius: 999px;
        background: rgba(26, 95, 168, 0.18);
        overflow: hidden;
      }
      .app-splash-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--app-splash-ink);
        animation: app-splash-bar-slide 1.25s ease-in-out infinite;
      }
      @keyframes app-splash-bar-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(275%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-bar-fill {
          animation: none;
          width: 100%;
          transform: none;
          opacity: 0.55;
        }
      }
      .app-tablet-landscape-hint,
      .app-phone-portrait-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        box-sizing: border-box;
      }
    </style>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body class="lp-app-bg">
    <noscript>
      <div
        style="
          padding: 1.5rem;
          max-width: 40rem;
          margin: 0 auto;
          font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
          line-height: 1.65;
          color: #1d1d1f;
          background: #fff;
        "
      >
        <h1 style="font-size: 1.35rem; margin: 0 0 0.75rem">Time = Money</h1>
        <p style="margin: 0 0 0.75rem">
          KPI·목표 관리, 시간 기반 기록, 일정·가계부·일지·습관 트래커를 하나의 웹 앱에서 사용하는 생산성 서비스입니다.
        </p>
        <p style="margin: 0 0 0.75rem">
          이 페이지를 이용하려면 브라우저에서 JavaScript를 켜 주세요. 모바일·데스크톱에서 회원가입·로그인 후 데이터가 동기화됩니다.
        </p>
        <p style="margin: 0; font-size: 0.875rem; color: #6e6e73">공식 주소: organismplanner.com</p>
      </div>
    </noscript>
    <div
      id="app-splash"
      class="app-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="앱을 불러오는 중"
    >
      <div class="app-splash-bar-wrap">
        <div class="app-splash-bar-track" aria-hidden="true">
          <div class="app-splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <!-- 태블릿(아이패드 미니 등) 세로: 가로 전환 안내 (CSS로 표시 구간 제어) -->
    <div
      id="tablet-landscape-hint"
      class="app-tablet-landscape-hint"
      aria-hidden="true"
    >
      <div class="app-tablet-landscape-hint-inner">
        <p id="tablet-landscape-hint-title" class="app-tablet-landscape-hint-title">
          가로 모드에서 이용해 주세요
        </p>
        <p class="app-tablet-landscape-hint-desc">
          이 화면 크기에서는 세로보다 <strong>가로</strong>로 두는 것이 보기 좋습니다.<br />
          기기를 옆으로 돌려 주세요.
        </p>
      </div>
    </div>
    <!-- 모바일 폰 가로: 세로 전환 안내 (CSS로 표시 구간 제어) -->
    <div
      id="phone-portrait-hint"
      class="app-phone-portrait-hint"
      aria-hidden="true"
    >
      <div class="app-phone-portrait-hint-inner">
        <p id="phone-portrait-hint-title" class="app-phone-portrait-hint-title">
          세로 모드에서 이용해 주세요
        </p>
        <p class="app-phone-portrait-hint-desc">
          모바일에서는 화면을 <strong>세로</strong>로 돌려 주세요.
        </p>
      </div>
    </div>
    <div id="app">
      <!-- 진입: 기본 로그인 — 상단 세그먼트로 회원가입 전환 -->
      <div id="login-page" class="page login-page login-page--gate" style="display: flex">
        <div class="auth-gate-body">
          <div class="login-wrap">
            <div class="app-home-menu-launcher-brand">
              <p class="app-home-menu-launcher-title">Time = Money</p>
            </div>
            <div class="login-card login-card--brand">
              <h1 class="auth-gate-heading login-title" id="auth-gate-heading">로그인</h1>
              <div
                class="auth-gate-segments"
                id="auth-gate-segments"
                role="tablist"
                aria-label="로그인 또는 회원가입"
              >
              <button
                type="button"
                role="tab"
                id="auth-seg-login"
                class="auth-gate-seg is-active"
                aria-selected="true"
                aria-controls="auth-panel-login"
              >
                로그인
              </button>
              <button
                type="button"
                role="tab"
                id="auth-seg-signup"
                class="auth-gate-seg"
                aria-selected="false"
                aria-controls="auth-panel-signup"
              >
                회원가입
              </button>
            </div>
            <div id="auth-panel-signup" class="auth-gate-panel" style="display: none">
            <form class="login-form login-form--auth-gate" id="signup-form" onsubmit="return false">
              <div class="login-field login-field--auth">
                <label class="login-label" for="signup-email">이메일</label>
                <input
                  type="email"
                  id="signup-email"
                  class="login-input login-input--auth"
                  placeholder="이메일 주소"
                  autocomplete="email"
                />
              </div>
              <div class="login-field login-field--auth">
                <label class="login-label" for="signup-pw">비밀번호</label>
                <div class="login-password-row">
                  <input
                    type="password"
                    id="signup-pw"
                    class="login-input login-input--auth login-input--in-password-row"
                    placeholder="6자 이상"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="login-pw-toggle"
                    id="signup-pw-toggle"
                    aria-label="비밀번호 보기"
                    aria-pressed="false"
                  >
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--show" aria-hidden="true">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--hide" aria-hidden="true" hidden>
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </span>
                  </button>
                </div>
              </div>
              <div class="login-field login-field--auth">
                <label class="login-label" for="signup-pw-confirm">비밀번호 확인</label>
                <div class="login-password-row">
                  <input
                    type="password"
                    id="signup-pw-confirm"
                    class="login-input login-input--auth login-input--in-password-row"
                    placeholder="비밀번호 다시 입력"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="login-pw-toggle"
                    id="signup-pw-confirm-toggle"
                    aria-label="비밀번호 확인란 보기"
                    aria-pressed="false"
                  >
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--show" aria-hidden="true">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--hide" aria-hidden="true" hidden>
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </span>
                  </button>
                </div>
              </div>
              <button type="button" class="login-btn-cta" id="btn-do-signup">가입하기</button>
            </form>
            </div>
            <div id="auth-panel-login" class="auth-gate-panel">
            <form class="login-form login-form--auth-gate" onsubmit="return false">
              <div class="login-field login-field--auth">
                <label class="login-label" for="login-id">이메일</label>
                <input
                  type="email"
                  id="login-id"
                  class="login-input login-input--auth"
                  placeholder="가입 시 사용한 이메일"
                  autocomplete="email"
                />
              </div>
              <div class="login-field login-field--auth">
                <label class="login-label" for="login-pw">비밀번호</label>
                <div class="login-password-row">
                  <input
                    type="password"
                    id="login-pw"
                    class="login-input login-input--auth login-input--in-password-row"
                    placeholder="비밀번호 입력"
                    autocomplete="current-password"
                  />
                  <button
                    type="button"
                    class="login-pw-toggle"
                    id="login-pw-toggle"
                    aria-label="비밀번호 보기"
                    aria-pressed="false"
                  >
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--show" aria-hidden="true">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span class="login-pw-toggle__icon login-pw-toggle__icon--hide" aria-hidden="true" hidden>
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </span>
                  </button>
                </div>
              </div>
              <button type="button" class="login-btn-cta" id="btn-do-login">로그인</button>
            </form>
            <p class="login-auth-switch login-auth-switch--forgot">
              <button type="button" class="login-link login-link--forgot" id="btn-show-forgot-pw">
                비밀번호를 잊었나요?
              </button>
            </p>
            </div>
            </div>
          </div>
        </div>
        <div
          id="auth-pw-recovery-modal"
          class="auth-pw-modal"
          hidden
          aria-hidden="true"
        >
          <div class="auth-pw-modal__backdrop" tabindex="-1" aria-hidden="true"></div>
          <div
            class="auth-pw-modal__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="auth-pw-modal-title"
          >
            <div class="auth-pw-modal__head">
              <h2 id="auth-pw-modal-title" class="auth-pw-modal__title">비밀번호를 잊었나요?</h2>
              <button type="button" class="auth-pw-modal__close" id="auth-pw-modal-close" aria-label="닫기">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <div class="auth-pw-modal__body">
              <div id="forgot-pw-form" class="login-change-form">
                <p class="login-forgot-desc">가입한 이메일 주소를 입력하면 비밀번호 재설정 링크를 보내드려요.</p>
                <input
                  type="text"
                  id="forgot-pw-email"
                  class="login-input login-input--auth"
                  placeholder="이메일 주소"
                  autocomplete="email"
                />
                <div class="login-change-actions">
                  <button type="button" class="login-btn-cta login-btn-sm" id="btn-send-reset-mail">
                    재설정 메일 보내기
                  </button>
                  <button type="button" class="login-link" id="btn-cancel-forgot">취소</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 비밀번호 재설정 (이메일 링크 클릭 후) -->
      <div id="reset-password-page" class="page login-page login-page--gate" style="display: none">
        <div class="auth-gate-body">
          <div class="login-wrap">
            <div class="app-home-menu-launcher-brand">
              <p class="app-home-menu-launcher-title">Time = Money</p>
            </div>
            <div class="login-card login-card--brand">
              <h1 class="login-title">새 비밀번호 설정</h1>
              <p class="login-desc">새 비밀번호를 입력해 주세요.</p>
              <form class="login-form login-form--auth-gate" onsubmit="return false">
                <div class="login-field login-field--auth">
                  <label class="login-label" for="reset-pw-new">새 비밀번호</label>
                  <input
                    type="password"
                    id="reset-pw-new"
                    class="login-input login-input--auth"
                    placeholder="새 비밀번호 (6자 이상)"
                    autocomplete="new-password"
                  />
                </div>
                <div class="login-field login-field--auth">
                  <label class="login-label" for="reset-pw-confirm">새 비밀번호 확인</label>
                  <input
                    type="password"
                    id="reset-pw-confirm"
                    class="login-input login-input--auth"
                    placeholder="새 비밀번호 확인"
                    autocomplete="new-password"
                  />
                  <label class="login-show-pw">
                    <input type="checkbox" id="reset-pw-show" class="login-show-pw-checkbox" /> 비밀번호 보기
                  </label>
                </div>
                <button type="button" class="login-btn-cta" id="btn-reset-pw-submit">비밀번호 변경하기</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- 로그인 성공 후 메인 앱 -->
      <div id="signin-page" class="page" style="display:none">
        <div id="app-screen"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
